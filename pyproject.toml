# Configuración de las herramientas de calidad del código. La aplicación no la
# lee: Flask arranca igual sin este archivo y la imagen de Docker no lo copia.
#
#   pip install -r requirements-dev.txt
#   ruff check .
#   mypy

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "F",    # imports y variables sin usar
    "ERA",  # código comentado
    "E",    # estilo PEP 8
    "W",
    "N",    # nombres PEP 8
    "I",    # orden de los imports
    "UP",   # sintaxis moderna para Python 3.9
    "B",    # errores probables, como perder la causa de una excepción
    "C90",  # complejidad ciclomática
    "SIM",  # condiciones que se pueden simplificar
    "RET",  # returns innecesarios
    "PIE",
    "S",    # seguridad
    "BLE",  # except Exception que se traga cualquier error
    "ANN",  # anotaciones de tipo
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.isort]
known-first-party = ["business", "data_access", "entities", "presentation"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
# flask-sock y simple-websocket no publican tipos: `stubs/` declara solo lo
# que usa la aplicación, para no tener que ignorarlos.
mypy_path = "stubs"
files = ["app.py", "business", "data_access", "entities", "presentation"]
